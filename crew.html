<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Meet the crew who will take you to space." />
  <title>Space Tourism | Crew</title>
  <link rel="icon" href="assets/shared/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Barlow+Condensed:wght@400;700&family=Barlow:wght@400;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="crew">

  <!-- ============================ الهيدر + النافيجيشن ============================ -->
  <header class="primary-header flex">
    <div class="logo-container">
      <img src="assets/shared/logo.svg" alt="Space Tourism Logo" class="logo" width="48" height="48" />
    </div>

    <button class="mobile-nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Menu" data-nav-toggle>
      <img src="assets/shared/icon-hamburger.svg" alt="" aria-hidden="true" />
    </button>

    <nav>
      <ul id="primary-navigation" data-visible="false" class="primary-navigation underline-indicators flex">
        <li><a class="nav-link" href="index.html"><span aria-hidden="true">00</span>Home</a></li>
        <li><a class="nav-link" href="destination.html"><span aria-hidden="true">01</span>Destination</a></li>
        <li><a class="nav-link active" aria-current="page" href="crew.html"><span aria-hidden="true">02</span>Crew</a></li>
        <li><a class="nav-link" href="technology.html"><span aria-hidden="true">03</span>Technology</a></li>
      </ul>
    </nav>
  </header>

  <!-- ============================ المحتوى الرئيسي ============================ -->
  <main class="grid-container grid-container--crew">
    <h1 class="numbered-title crew-title">
      <span aria-hidden="true">02</span> Meet your crew
    </h1>

    <article id="crew-panel" class="crew-content flex">
      <!-- المحتوى النصي بتاع رائد الفضاء الحالي، بيتغير بالجافاسكريبت -->
      <div>
        <h2 id="crew-role" class="text-preset-3 uppercase">Commander</h2>
        <p id="crew-name" class="text-preset-2 uppercase">Douglas Hurley</p>
      </div>
      <p id="crew-bio" class="text-accent">
        <!-- نبذة عن رائد الفضاء، بتتغير بالجافاسكريبت -->
        Douglas Gerald Hurley is an American engineer, former Marine Corps pilot and
        former NASA astronaut. He launched into space for the third time as commander
        of Crew Dragon Demo-2.
      </p>
    </article>

    <!-- النقط اللي بنختار بيها رائد الفضاء -->
    <div class="dot-indicators flex crew-dots" role="tablist" aria-label="crew member list">
      <button aria-selected="true" role="tab" tabindex="0" data-value="Douglas Hurley">
        <span class="sr-only">Douglas Hurley</span>
      </button>
      <button aria-selected="false" role="tab" tabindex="-1" data-value="Mark Shuttleworth">
        <span class="sr-only">Mark Shuttleworth</span>
      </button>
      <button aria-selected="false" role="tab" tabindex="-1" data-value="Victor Glover">
        <span class="sr-only">Victor Glover</span>
      </button>
      <button aria-selected="false" role="tab" tabindex="-1" data-value="Anousheh Ansari">
        <span class="sr-only">Anousheh Ansari</span>
      </button>
    </div>

    <picture class="crew-image">
      <!-- صورة رائد الفضاء الحالي، بتتغير بالجافاسكريبت -->
      <source id="crew-img-webp" srcset="assets/crew/image-douglas-hurley.webp" type="image/webp" />
      <img id="crew-img" src="assets/crew/image-douglas-hurley.png" alt="Douglas Hurley" />
    </picture>
  </main>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
  <script>
    // -------------------- كود خاص بصفحة الطاقم بس -------------------- //

    // دالة بتاخد اسم رائد الفضاء وتعرض بياناته في الصفحة
    function renderCrewMember(name) {
      // ندور على العضو المطلوب جوه مصفوفة الطاقم
      const member = SPACE_DATA.crew.find((c) => c.name === name);
      if (!member) return; // أمان لو الاسم مش موجود لأي سبب

      document.getElementById('crew-role').textContent = member.role; // تحديث المنصب
      document.getElementById('crew-name').textContent = member.name; // تحديث الاسم
      document.getElementById('crew-bio').textContent = member.bio;   // تحديث النبذة
      document.getElementById('crew-img-webp').srcset = member.images.webp; // تحديث صورة WEBP
      document.getElementById('crew-img').src = member.images.png;          // تحديث صورة PNG
      document.getElementById('crew-img').alt = member.name;                // تحديث النص البديل
    }

    // تفعيل نظام النقط (تابات) وربطه بدالة renderCrewMember
    setupTabs('.crew-dots', (value) => renderCrewMember(value), '#crew-panel');
  </script>
</body>
</html>
